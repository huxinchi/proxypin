name: Build ProxyPin APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Setup Android SDK with packages
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;26.3.11579264 cmake;3.22.1 platform-tools build-tools;34.0.0'

      - name: Export NDK env
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV

      - name: Setup Rust (for flutter_rust_bridge)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Flutter doctor
        run: flutter doctor -v
      - name: Upgrade AGP to 8.11.1
        run: |
          # 尝试修改 settings.gradle / settings.gradle.kts
          find android -name "settings.gradle*" -exec sed -i 's/com.android.application.*8\.[0-9]*\.[0-9]*/com.android.application" version "8.11.1"/g' {} +
          # 尝试修改 build.gradle 中的 classpath 写法（旧模板）
          find android -name "build.gradle*" -exec sed -i "s#com.android.tools.build:gradle:[0-9.]*#com.android.tools.build:gradle:8.11.1#g" {} +
      - name: Upgrade Gradle Wrapper to 8.14
        run: |
          sed -i 's|^distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14-all.zip|' android/gradle/wrapper/gradle-wrapper.properties
          cat android/gradle/wrapper/gradle-wrapper.properties
      - name: Get dependencies
        run: flutter pub get

      - name: Run codegen (optional)
        run: |
          if [ -f "justfile" ]; then
            cargo install just --locked || true
            just generate || true
          fi

      - name: Build APK (debug, arm64 only)
        run: flutter build apk --debug --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: proxypin-apk-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error